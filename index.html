<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Боевой клич — прямая опора</title>
<style>
/* Layout: одна колонка под телефон; общие кнопки вида и показа сверху, разделы друг под другом, в разделе варианты синхронно. */
:root {
  --bg: #e9e7e3;
  --surface: #f6f5f2;
  --fg: #1f1c19;
  --muted: #6a625a;
  --line: #d3cdc5;
  --accent: #b44d1c;
  --accent-soft: #f0d9cb;
  --stage: #2a2723;
  --font: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --surface: #1d1b18; --fg: #ece7e0; --muted: #a39a90; --line: #35312c;
    --accent: #e0793f; --accent-soft: #3a261a; --stage: #22201c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --surface: #1d1b18; --fg: #ece7e0; --muted: #a39a90; --line: #35312c;
  --accent: #e0793f; --accent-soft: #3a261a; --stage: #22201c; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.page { max-width: 440px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 22px; }
h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; font-weight: 800; margin: 0; }
p { margin: 0; }
.lead, .note { color: var(--muted); }
.note { font-size: 13px; }
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); width: 64px; flex: none; }
.seg { display: flex; flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button, .step { font: inherit; font-size: 14px; font-weight: 600; color: var(--fg); background: var(--surface); border: 0; padding: 8px 6px; flex: 1; cursor: pointer; min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.step { flex: none; width: 48px; border: 1px solid var(--line); border-radius: 8px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.section { display: grid; gap: 14px; padding-top: 6px; border-top: 1px solid var(--line); }
.variant { display: grid; gap: 8px; }
.tag { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding-inline: 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; margin-right: 8px; font-variant-numeric: tabular-nums; }
.stage { background: var(--stage); border-radius: 10px; display: grid; place-items: center; overflow: hidden; }
.player { width: 100%; max-width: 100%; aspect-ratio: 1; background-repeat: no-repeat; cursor: pointer; }
.stage.game { padding-block: 12px; }
.stage.game .player { width: 200px; }
.bar { position: relative; height: 18px; }
.bar .track { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line); }
.bar .fill { position: absolute; left: 0; top: 8px; height: 2px; background: var(--muted); width: 0; }
.bar .hit { position: absolute; top: 2px; width: 2px; height: 14px; background: var(--accent); }
.bar .hit-label { position: absolute; top: -1px; font-size: 11px; font-weight: 800; color: var(--accent); transform: translateX(6px); opacity: 0.45; }
.bar.flash .hit-label { opacity: 1; }
ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
li::marker { color: var(--muted); }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
</style>

<main class="page">
  <header style="display:grid; gap:8px">
    <h1>Боевой клич</h1>
    <p class="lead">Корпус почти вертикален, колени лишь немного согнуты. При подъёме и возврате стопы остаются на месте. Нажми на картинку — пауза.</p>
  </header>

  <section class="controls" aria-label="Управление">
    <div class="row"><span class="row-label">Вид</span>
      <div class="seg" id="view-seg">
        <button type="button" id="view-close" data-view="close" aria-pressed="false">Крупно</button>
        <button type="button" id="view-front" data-view="front" aria-pressed="true">Спереди</button>
        <button type="button" id="view-side" data-view="side" aria-pressed="false">Сбоку</button>
        <button type="button" id="view-game" data-view="game" aria-pressed="false">Как в игре</button>
      </div>
    </div>
    <div class="row"><span class="row-label">Показ</span>
      <div class="seg" id="speed-seg">
        <button type="button" id="speed-1" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" id="speed-q" data-speed="0.25" aria-pressed="false">¼×</button>
        <button type="button" id="play" aria-pressed="false">Пауза</button>
      </div>
      <button type="button" class="step" id="back" aria-label="Кадр назад">‹</button>
      <button type="button" class="step" id="fwd" aria-label="Кадр вперёд">›</button>
    </div>
  </section>

  <div id="sections"></div>

  <section class="ask">
    <h2>Опора и корпус</h2>
    <p>Посмотри опору ног и наклон корпуса спереди и сбоку, в верхней позе и в движении.</p>
  </section>
</main>

  const FPS = M.fps;
  const root = document.getElementById("sections");
  const groups = [];
  let view = "front";
  let speed = 1;
  let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let clock = 0;
  let last = null;

  for (const s of M.sections) {
    const sec = document.createElement("section");
    sec.className = "section";
    sec.innerHTML = `<h2></h2>${s.note ? '<p class="note"></p>' : ""}`;
    sec.querySelector("h2").textContent = s.title;
    if (s.note) sec.querySelector(".note").textContent = s.note;
    const players = [];
    s.variants.forEach((v, i) => {
      const art = document.createElement("article");
      art.className = "variant";
      art.innerHTML = `<h3><span class="tag">${i + 1}</span><span class="name"></span></h3>
        <div class="stage"><div class="player" role="img"></div></div>
        <div class="bar"><div class="track"></div><div class="fill"></div><div class="hit"></div><span class="hit-label">удар</span></div>`;
      art.querySelector(".name").textContent = v.title;
      art.querySelector(".player").setAttribute("aria-label", `${s.title}: ${v.title}`);
      if (v.notes && v.notes.length) {
        const ul = document.createElement("ul");
        for (const n of v.notes) { const li = document.createElement("li"); li.textContent = n; ul.appendChild(li); }
        art.appendChild(ul);
      }
      sec.appendChild(art);
      if (["war_cry", "dash"].includes(s.id)) {
        art.querySelector(".hit").hidden = true;
        art.querySelector(".hit-label").hidden = true;
      }
      const player = art.querySelector(".player");
      player.addEventListener("click", togglePlay);
      players.push({ v, player, stage: art.querySelector(".stage"), fill: art.querySelector(".fill"), bar: art.querySelector(".bar"), hit: art.querySelector(".hit"), label: art.querySelector(".hit-label") });
    });
    root.appendChild(sec);
    groups.push({ frames: Math.max(...s.variants.map((v) => v.frames)), players });
  }

  function applyView() {
    for (const g of groups) for (const p of g.players) {
      p.player.style.backgroundImage = `url("${STRIPS[p.v.strip.replace("%s", view)]}")`;
      p.player.style.backgroundSize = `${p.v.columns * 100}% ${p.v.rows * 100}%`;
      p.stage.classList.toggle("game", view === "game");
      const pct = (M.hit_frame / Math.max(1, p.v.frames - 1)) * 100;
      p.hit.style.left = `${pct}%`;
      p.label.style.left = `${pct}%`;
    }
  }

  function draw() {
    const tick = Math.floor(clock * FPS + 1e-6);
    for (const g of groups) {
      const frame = tick % g.frames;
      for (const p of g.players) {
        const f = Math.min(frame, p.v.frames - 1);
        const col = f % p.v.columns;
        const row = Math.floor(f / p.v.columns);
        const x = p.v.columns > 1 ? (col / (p.v.columns - 1)) * 100 : 0;
        const y = p.v.rows > 1 ? (row / (p.v.rows - 1)) * 100 : 0;
        p.player.style.backgroundPosition = `${x}% ${y}%`;
        p.fill.style.width = `${p.v.frames > 1 ? (f / (p.v.frames - 1)) * 100 : 0}%`;
        p.bar.classList.toggle("flash", f >= M.hit_frame && f <= M.hit_frame + 2);
      }
    }
  }

  function tick(now) {
    if (last !== null && playing) clock += ((now - last) / 1000) * speed;
    last = now;
    draw();
    requestAnimationFrame(tick);
  }

  function togglePlay() {
    playing = !playing;
    const btn = document.getElementById("play");
    btn.textContent = playing ? "Пауза" : "Пуск";
    btn.setAttribute("aria-pressed", String(!playing));
  }

  function step(delta) {
    if (playing) togglePlay();
    clock = Math.max(0, Math.floor(clock * FPS + 1e-6) + delta) / FPS;
    draw();
  }

  function press(seg, btn) {
    for (const b of seg.querySelectorAll("button[data-view], button[data-speed]")) b.setAttribute("aria-pressed", String(b === btn));
  }

  const viewSeg = document.getElementById("view-seg");
  viewSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (!btn) return;
    view = btn.dataset.view;
    press(viewSeg, btn);
    applyView();
  });
  const speedSeg = document.getElementById("speed-seg");
  speedSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.id === "play") { togglePlay(); return; }
    speed = Number(btn.dataset.speed);
    press(speedSeg, btn);
  });
  document.getElementById("back").addEventListener("click", () => step(-1));
  document.getElementById("fwd").addEventListener("click", () => step(1));
  if (!playing) { document.getElementById("play").textContent = "Пуск"; }
  applyView();
  draw();
  requestAnimationFrame(tick);
})();
</script>
